<div class="topbar-nav" id="topbar-nav">
    {% if subscription %}
        <div class="topbar-user-dropdown">
            <button class="topbar-dropdown-trigger" onclick="toggleDropdown(event)" aria-haspopup="true" aria-expanded="false">
                {{ subscription.email }}
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>
            <div class="topbar-dropdown-menu" id="user-dropdown" role="menu">
                <a class="topbar-dropdown-item" role="menuitem"
                   href="/follows?token={{ subscription.unsubscribe_token }}">
                    Mis ofertas
                </a>
                <a class="topbar-dropdown-item" role="menuitem"
                   href="/search-subscriptions?token={{ subscription.unsubscribe_token }}">
                    Mis busquedas
                </a>
                <a class="topbar-dropdown-item" role="menuitem"
                   href="/auth/login"
                   onclick="event.preventDefault(); logout()">
                    Cerrar sesion
                </a>
            </div>
        </div>
    {% else %}
        <a class="topbar-nav-link" href="/auth/login" aria-label="Iniciar sesion">
            Iniciar sesion
        </a>
        <a class="topbar-nav-link" href="/auth/register" aria-label="Crear cuenta">
            Registrarse
        </a>
        <span id="follows-link" style="display:none;">
            <a class="topbar-nav-link" href="/follows?token="
               onclick="event.preventDefault(); var t = localStorage.getItem('unsubscribe_token'); if (t) { window.location.href = '/follows?token=' + t; }"
               aria-label="Mis ofertas seguidas">
                Mis ofertas
            </a>
        </span>
    {% endif %}
</div>
