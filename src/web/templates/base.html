<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Job Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
    // ── Auth token from localStorage ──────────────────────────────────────
    function getToken() {
      return localStorage.getItem('unsubscribe_token') || '';
    }

    // ── Offer following ───────────────────────────────────────────────────
    function toggleFollow(btn) {
      var offerId = btn.getAttribute('data-offer-id');
      var token   = getToken();
      var isFollowing = btn.classList.contains('btn-follow--active');
      var method  = isFollowing ? 'DELETE' : 'POST';

      fetch('/offers/' + offerId + '/follow?token=' + token, { method: method })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.followed) {
            btn.classList.add('btn-follow--active');
            btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Siguiendo';
          } else {
            btn.classList.remove('btn-follow--active');
            btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Seguir';
          }
        });
    }

    // ── Logout ────────────────────────────────────────────────────────────
    function logout() {
      var token = getToken();
      if (!token) { window.location.href = '/auth/login'; return; }
      fetch('/auth/logout', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function() {
        localStorage.removeItem('unsubscribe_token');
        window.location.href = '/';
      });
    }

    // ── User dropdown ───────────────────────────────────────────────────
    function toggleDropdown(event) {
      if (event) event.stopPropagation();
      var menu = document.getElementById('user-dropdown');
      var btn  = document.querySelector('.topbar-dropdown-trigger');
      if (!menu) return;
      var isOpen = menu.style.display === 'block';
      menu.style.display = isOpen ? 'none' : 'block';
      if (btn) btn.setAttribute('aria-expanded', !isOpen);
    }

    document.addEventListener('click', function() {
      var menu = document.getElementById('user-dropdown');
      var btn  = document.querySelector('.topbar-dropdown-trigger');
      if (menu) menu.style.display = 'none';
      if (btn) btn.setAttribute('aria-expanded', 'false');
    });

    // ── Restore auth state from localStorage on page load ────────────────
    document.addEventListener('DOMContentLoaded', function() {
      var token = localStorage.getItem('unsubscribe_token');
      if (!token) return;
      fetch('/auth/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(function(r) {
        if (!r.ok) throw new Error('invalid token');
        return r.json();
      })
      .then(function(data) {
        var nav = document.getElementById('topbar-nav');
        if (!nav) return;
        nav.innerHTML =
          '<div class="topbar-user-dropdown">' +
            '<button class="topbar-dropdown-trigger" onclick="toggleDropdown(event)" aria-haspopup="true" aria-expanded="false">' +
              data.email +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                '<polyline points="6 9 12 15 18 9"/>' +
              '</svg>' +
            '</button>' +
            '<div class="topbar-dropdown-menu" id="user-dropdown" role="menu">' +
              '<a class="topbar-dropdown-item" role="menuitem" href="/follows?token=' + token + '">Mis ofertas</a>' +
              '<a class="topbar-dropdown-item" role="menuitem" href="/search-subscriptions?token=' + token + '">Mis busquedas</a>' +
              '<a class="topbar-dropdown-item" role="menuitem" href="/auth/login" onclick="event.preventDefault(); logout()">Cerrar sesion</a>' +
            '</div>' +
          '</div>';
      })
      .catch(function() {
        localStorage.removeItem('unsubscribe_token');
      });
    });
    </script>
</head>
<body>
    <header class="topbar" role="banner">
        <div class="topbar-inner">
            <a class="brand" href="/" aria-label="Job Tracker inicio">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="7" width="20" height="14" rx="2"/>
                    <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                    <line x1="12" y1="12" x2="12" y2="17"/>
                    <line x1="9.5" y1="14.5" x2="14.5" y2="14.5"/>
                </svg>
                Job Tracker
            </a>
            {% block topbar_search %}{% endblock %}
            {% include "partials/navbar.html" %}
        </div>
    </header>
    <div class="app-shell">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
